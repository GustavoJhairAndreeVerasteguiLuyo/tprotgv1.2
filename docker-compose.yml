version: '3.8'
services:
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
  ai-service:
    build: ./ai_service
    ports:
      - "8000:8000"
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: file:perimeter.db
      MQTT_BROKER: tcp://mosquitto:1883
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: changeme
    depends_on:
      - mosquitto
      - ai-service
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
